# CI/CD Pipeline for Cakes n Bakes 365

name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Job 1: Check code quality and validate configs
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install backend dependencies
      - name: Install backend deps
        run: npm ci --prefix backend

      # Make sure all JS files have valid syntax
      - name: Check backend syntax
        run: find backend/src -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check

      # Validate that docker-compose.yml is correct
      - name: Validate compose file
        run: docker compose config

  # Job 2: Build everything and run smoke tests
  docker-smoke-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Use the example env file for CI
      - name: Setup env file
        run: cp .env.ci.example .env

      # Build and start all services
      - name: Build and start
        run: docker compose up -d --build

      # Check if the app is actually working
      - name: Run smoke tests
        run: ./scripts/smoke-test.sh

      # If something went wrong, show the logs
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=120

      # Clean up after ourselves
      - name: Cleanup
        if: always()
        run: docker compose down -v

  # Job 3: Push Docker images to GitHub Container Registry
  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: docker-smoke-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push backend image
      - name: Backend image metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cakesnbakes-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      # Build and push frontend image
      - name: Frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cakesnbakes-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

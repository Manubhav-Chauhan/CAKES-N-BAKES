apiVersion: batch/v1
kind: Job
metadata:
  name: cnb-db-migration
  namespace: cakesnbakes
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "-c", "psql \"$DATABASE_URL\" -f /migrations/schema.sql"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cnb-app-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: schema-file
              mountPath: /migrations
      volumes:
        - name: schema-file
          configMap:
            name: cnb-schema

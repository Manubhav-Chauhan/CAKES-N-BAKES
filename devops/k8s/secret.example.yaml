apiVersion: v1
kind: Secret
metadata:
  name: cnb-app-secrets
  namespace: cakesnbakes
type: Opaque
stringData:
  POSTGRES_DB: cakesnbakes
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://postgres:change-me@cnb-db:5432/cakesnbakes

  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: change-me
  ADMIN_AUTH_SECRET: please-change-this-secret
  ADMIN_TOKEN_TTL_SECONDS: "43200"
  ADMIN_VIEW_USER: adminviewer
  ADMIN_VIEW_PASSWORD: change-me

  WHATSAPP_ACCOUNT_SID: ""
  WHATSAPP_AUTH_TOKEN: ""
  WHATSAPP_FROM: ""
  WHATSAPP_NUMBER: ""
  ADMIN_WHATSAPP_NUMBER: ""

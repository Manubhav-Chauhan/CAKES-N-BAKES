apiVersion: v1
kind: Secret
metadata:
  name: cnb-app-secrets
  namespace: cakesnbakes
type: Opaque
stringData:
  POSTGRES_DB: cakesnbakes
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgres://postgres:postgres@cnb-db:5432/cakesnbakes

  ADMIN_USERNAME: [ADMIN_USERNAME]
  ADMIN_PASSWORD: [ADMIN_PASSWORD]
  ADMIN_AUTH_SECRET: [ADMIN_AUTH_SECRET]
  ADMIN_TOKEN_TTL_SECONDS: "43200"
  ADMIN_VIEW_USER: [ADMIN_VIEW_USER]
  ADMIN_VIEW_PASSWORD: [ADMIN_VIEW_PASSWORD]

  WHATSAPP_ACCOUNT_SID: ""
  WHATSAPP_AUTH_TOKEN: ""
  WHATSAPP_FROM: ""
  WHATSAPP_NUMBER: ""
  ADMIN_WHATSAPP_NUMBER: ""

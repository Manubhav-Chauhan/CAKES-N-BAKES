apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnb-db-pvc
  namespace: cakesnbakes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnb-db
  namespace: cakesnbakes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnb-db
  template:
    metadata:
      labels:
        app: cnb-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cnb-app-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cnb-app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cnb-app-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: cnb-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cnb-db
  namespace: cakesnbakes
spec:
  selector:
    app: cnb-db
  ports:
    - port: 5432
      targetPort: 5432

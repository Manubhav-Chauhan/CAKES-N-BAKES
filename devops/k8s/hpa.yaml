apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cnb-backend-hpa
  namespace: cakesnbakes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cnb-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cnb-frontend-hpa
  namespace: cakesnbakes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cnb-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cakesnbakes.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "cakesnbakes.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | quote }}
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  DATABASE_URL: {{ tpl .Values.secrets.DATABASE_URL . | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.ADMIN_USERNAME | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.ADMIN_PASSWORD | quote }}
  ADMIN_AUTH_SECRET: {{ .Values.secrets.ADMIN_AUTH_SECRET | quote }}
  ADMIN_TOKEN_TTL_SECONDS: {{ .Values.secrets.ADMIN_TOKEN_TTL_SECONDS | quote }}
  ADMIN_VIEW_USER: {{ .Values.secrets.ADMIN_VIEW_USER | quote }}
  ADMIN_VIEW_PASSWORD: {{ .Values.secrets.ADMIN_VIEW_PASSWORD | quote }}
  WHATSAPP_ACCOUNT_SID: {{ .Values.secrets.WHATSAPP_ACCOUNT_SID | quote }}
  WHATSAPP_AUTH_TOKEN: {{ .Values.secrets.WHATSAPP_AUTH_TOKEN | quote }}
  WHATSAPP_FROM: {{ .Values.secrets.WHATSAPP_FROM | quote }}
  WHATSAPP_NUMBER: {{ .Values.secrets.WHATSAPP_NUMBER | quote }}

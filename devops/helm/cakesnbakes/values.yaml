nameOverride: ""
fullnameOverride: ""

images:
  backend:
    repository: ghcr.io/rakshitmalik136/cakesnbakes-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/rakshitmalik136/cakesnbakes-frontend
    tag: latest
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

service:
  backendPort: 4000
  frontendPort: 80
  dbPort: 5432

ingress:
  enabled: true
  className: nginx
  host: cakes.local

appConfig:
  NODE_ENV: production
  PORT: "4000"
  CLIENT_ORIGIN: "https://cakes.local,http://localhost"
  WHATSAPP_ENABLED: "true"
  WHATSAPP_DEFAULT_COUNTRY_CODE: "+91"
  WHATSAPP_BUSINESS_NAME: "Cakes n Bakes 365"
  API_BASE: "/api"

secrets:
  POSTGRES_DB: cakesnbakes
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ../../.env/POSTGRES_PASSWORD
  DATABASE_URL: postgres://postgres:../../.env/POSTGRES_PASSWORD@{{ include "cakesnbakes.fullname" . }}-db:5432/cakesnbakes
  ADMIN_USERNAME: ../../.env/ADMIN_USERNAME
  ADMIN_PASSWORD: ../../.env/ADMIN_PASSWORD
  ADMIN_AUTH_SECRET: ../../.env/ADMIN_AUTH_SECRET
  ADMIN_TOKEN_TTL_SECONDS: "43200"
  ADMIN_VIEW_USER: ../../.env/ADMIN_VIEW_USER
  ADMIN_VIEW_PASSWORD: ../../.env/ADMIN_VIEW_PASSWORD
  WHATSAPP_ACCOUNT_SID: ../../.env/WHATSAPP_ACCOUNT_SID
  WHATSAPP_AUTH_TOKEN: ../../.env/WHATSAPP_AUTH_TOKEN
  WHATSAPP_FROM: ../../.env/WHATSAPP_FROM
  WHATSAPP_NUMBER: ../../.env/WHATSAPP_NUMBER
  ADMIN_WHATSAPP_NUMBER: ../../.env/ADMIN_WHATSAPP_NUMBER

postgres:
  storage: 2Gi

replicaCount:
  backend: 2
  frontend: 2

resources:
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

hpa:
  enabled: true
  backend:
    minReplicas: 2
    maxReplicas: 5
    averageCpuUtilization: 70
  frontend:
    minReplicas: 2
    maxReplicas: 4
    averageCpuUtilization: 70

migration:
  enabled: false
  schemaConfigMapName: cnb-schema
